<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageFlow - My Patients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 text-blue-600 text-xl font-bold">
                <i class="fa-solid fa-heart-pulse text-2xl"></i>
                <span>TriageFlow</span>
            </div>
            <div class="flex items-center gap-2">
                <a href="/dashboard" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-gauge mr-2"></i>Dashboard</a>
                
                <a href="/my-patients" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium"><i class="fa-solid fa-user-injured mr-2"></i>My Patients</a>
                <a href="/waiting-room" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-users-viewfinder mr-2"></i>Waiting Room</a>
                <a href="/staff" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-users mr-2"></i>Staff</a>

                {% if user_role == 'Admin' %}
                <a href="/settings" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-cog mr-2"></i>Settings</a>
                {% endif %}
                <a href="/bed-qr" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-qrcode mr-2"></i>Bed QR</a>
                <a href="/all-patients" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-users-list mr-2"></i>All Patients</a>
                <a href="/logout" class="px-4 py-2 rounded-lg text-red-600 hover:bg-red-50 font-medium"><i class="fa-solid fa-sign-out mr-2"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="p-8 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-user-injured mr-2"></i>My Patients</h1>
                <p class="text-gray-500" id="staffInfo">Loading...</p>
            </div>
            <div class="flex gap-2">
                <button onclick="filterPatients('all')" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium filter-btn" data-filter="all">All</button>
                <button onclick="filterPatients('waiting')" class="px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 font-medium filter-btn" data-filter="waiting">Waiting</button>
                <button onclick="filterPatients('admitted')" class="px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 font-medium filter-btn" data-filter="admitted">Admitted</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="patientsGrid">
            <div class="col-span-full text-center py-8 text-gray-500">Loading patients...</div>
        </div>
    </div>

    <!-- Edit Patient Modal -->
    <div class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" id="editPatientModal">
        <div class="bg-white rounded-xl w-full max-w-lg mx-4 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="p-5 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 class="text-lg font-semibold"><i class="fa-solid fa-user-pen mr-2 text-blue-600"></i>Edit Patient</h3>
                <button class="text-gray-400 hover:text-gray-600 text-2xl" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="editPatientId">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Name</label><input type="text" id="editName" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Phone</label><input type="text" id="editPhone" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Age</label><input type="number" id="editAge" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Gender</label><select id="editGender" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Duration</label><input type="text" id="editDuration" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="e.g. 2 days"></div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Status</label><select id="editStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"><option value="waiting">Waiting</option><option value="admitted">Admitted</option><option value="discharged">Discharged</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Triage</label><select id="editTriage" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"><option value="simple">Simple</option><option value="attention">Attention</option><option value="emergency">Emergency</option><option value="critical">Critical</option></select></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Symptoms</label>
                    <div id="editSymptomsList" class="flex flex-wrap gap-2 mb-2"></div>
                    <div class="flex gap-2"><input type="text" id="editNewSymptom" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Add symptom..." onkeypress="if(event.key==='Enter'){event.preventDefault();addEditSymptom()}"><button type="button" onclick="addEditSymptom()" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700"><i class="fa-solid fa-plus"></i></button></div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Medications</label><input type="text" id="editMedications" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="editBreathingTrouble" class="rounded border-gray-300 text-blue-600"> Breathing trouble</label>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="editFamilyHistory" class="rounded border-gray-300 text-blue-600"> Family history</label>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="editSubstanceUse" class="rounded border-gray-300 text-blue-600"> Substance use</label>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="editSexuallyActive" class="rounded border-gray-300 text-blue-600"> Sexually active</label>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Notes</label><textarea id="editNotes" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></textarea></div>
                <div id="editFeedback" class="text-center text-sm hidden py-2 rounded-lg"></div>
            </div>
            <div class="p-5 border-t border-gray-200 flex justify-end gap-2 sticky bottom-0 bg-white">
                <button class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 font-medium" onclick="closeEditModal()">Cancel</button>
                <button class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium" onclick="savePatientEdit()"><i class="fa-solid fa-save mr-2"></i>Save</button>
            </div>
        </div>
    </div>

    <script>
        let myPatients = [];
        let staffData = [];
        let currentFilter = 'all';
        let currentStaffId = null;

        async function init() {
            try {
                const userRes = await fetch('/api/logged-in-user');
                const user = await userRes.json();
                
                if (!user.logged_in || (user.role !== 'Doctor' && user.role !== 'Nurse')) {
                    window.location.href = '/dashboard';
                    return;
                }
                
                document.getElementById('staffInfo').textContent = `${user.name} - ${user.role}`;
                
                const staffRes = await fetch('/api/staff');
                staffData = await staffRes.json();
                
                const currentStaff = staffData.find(s => s.name === user.name);
                if (currentStaff) {
                    currentStaffId = currentStaff._id;
                    loadMyPatients();
                }
            } catch (error) {
                console.error('Error initializing:', error);
            }
        }

        async function loadMyPatients() {
            try {
                const response = await fetch('/api/my-patients');
                myPatients = await response.json();
                renderPatients();
            } catch (error) {
                console.error('Error loading patients:', error);
                document.getElementById('patientsGrid').innerHTML = '<div class="col-span-full text-center py-8 text-red-500">Error loading patients</div>';
            }
        }

        function getStaffNameById(staffId) {
            const staff = staffData.find(s => s._id === staffId);
            return staff ? staff.name : 'Unknown';
        }

        function formatTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function getCategoryColor(category) {
            const colors = {
                simple: 'bg-green-500',
                attention: 'bg-yellow-500',
                emergency: 'bg-orange-500',
                critical: 'bg-red-600'
            };
            return colors[category] || 'bg-gray-500';
        }

        function getCategoryBadge(category) {
            const badges = {
                simple: 'bg-green-100 text-green-700',
                attention: 'bg-yellow-100 text-yellow-700',
                emergency: 'bg-orange-100 text-orange-700',
                critical: 'bg-red-100 text-red-700'
            };
            return badges[category] || 'bg-gray-100 text-gray-700';
        }

        function getStatusBadge(status) {
            const badges = {
                waiting: 'bg-amber-100 text-amber-700',
                admitted: 'bg-blue-100 text-blue-700'
            };
            return badges[status] || 'bg-gray-100 text-gray-700';
        }

        function filterPatients(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
            });
            event.target.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
            event.target.classList.add('bg-blue-600', 'text-white');
            renderPatients();
        }

        function renderPatients() {
            const grid = document.getElementById('patientsGrid');
            const filtered = currentFilter === 'all' 
                ? myPatients 
                : myPatients.filter(p => p.status === currentFilter);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">No patients assigned to you</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-lg p-4 border border-gray-200 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold ${getCategoryColor(p.triage_category)}">
                                ${p.triage_category.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="font-semibold text-gray-900">${p.name || 'Anonymous'}</h4>
                                <p class="text-gray-400 text-xs">${formatTime(p.check_in_time)}</p>
                            </div>
                        </div>
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${getCategoryBadge(p.triage_category)}">${p.triage_category}</span>
                    </div>
                    
                    <div class="space-y-2 text-sm mb-3">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Status:</span>
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${getStatusBadge(p.status)}">${p.status}</span>
                        </div>
                        <div class="text-gray-500">
                            <span>Symptoms: ${p.symptoms ? p.symptoms.join(', ') : 'None'}</span>
                        </div>
                        ${p.assigned_bed ? `
                        <div class="flex justify-between">
                            <span class="text-gray-500">Bed:</span>
                            <span class="text-gray-700 font-medium">${p.assigned_bed}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="border-t border-gray-100 pt-3 mt-3">
                        <div class="text-xs text-gray-500 mb-2">Assigned Staff:</div>
                        <div class="flex flex-wrap gap-1">
                            ${p.assigned_doctors && p.assigned_doctors.length > 0 ? 
                                p.assigned_doctors.map(d => `<span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded">Dr. ${getStaffNameById(d)}</span>`).join('') : 
                                ''}
                            ${p.assigned_nurses && p.assigned_nurses.length > 0 ? 
                                p.assigned_nurses.map(n => `<span class="text-xs bg-green-50 text-green-600 px-2 py-1 rounded">${getStaffNameById(n)}</span>`).join('') : 
                                ''}
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-3 mt-3 flex gap-2">
                        <button onclick="openEditModal('${p._id}')" class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium hover:bg-blue-700"><i class="fa-solid fa-pen mr-1"></i> Edit Patient</button>
                    </div>
                </div>
            `).join('');
        }

        // ========== Edit Patient Functions ==========
        let editSymptoms = [];

        async function openEditModal(patientId) {
            try {
                const res = await fetch(`/api/patients/${patientId}`);
                const p = await res.json();
                if (!p || p.error) { alert('Patient not found'); return; }
                document.getElementById('editPatientId').value = patientId;
                document.getElementById('editName').value = p.name || '';
                document.getElementById('editPhone').value = p.phone || '';
                document.getElementById('editAge').value = p.age || '';
                document.getElementById('editGender').value = p.gender || 'male';
                document.getElementById('editDuration').value = p.duration || '';
                document.getElementById('editStatus').value = p.status || 'waiting';
                document.getElementById('editTriage').value = p.triage_category || 'simple';
                document.getElementById('editMedications').value = p.medications || '';
                document.getElementById('editBreathingTrouble').checked = !!p.breathing_trouble;
                document.getElementById('editFamilyHistory').checked = !!p.family_history;
                document.getElementById('editSubstanceUse').checked = !!p.substance_use;
                document.getElementById('editSexuallyActive').checked = !!p.sexually_active;
                document.getElementById('editNotes').value = p.notes || '';
                editSymptoms = Array.isArray(p.symptoms) ? [...p.symptoms] : [];
                renderEditSymptoms();
                document.getElementById('editFeedback').classList.add('hidden');
                document.getElementById('editPatientModal').classList.remove('hidden');
                document.getElementById('editPatientModal').classList.add('flex');
            } catch (e) { alert('Error loading patient data'); }
        }

        function renderEditSymptoms() {
            const c = document.getElementById('editSymptomsList');
            if (editSymptoms.length === 0) { c.innerHTML = '<span class="text-gray-400 text-xs">No symptoms added</span>'; return; }
            c.innerHTML = editSymptoms.map((s, i) => `<span class="inline-flex items-center gap-1 bg-red-50 text-red-700 px-2 py-1 rounded-full text-xs">${s}<button onclick="removeEditSymptom(${i})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button></span>`).join('');
        }
        function addEditSymptom() { const input = document.getElementById('editNewSymptom'); const s = input.value.trim(); if (!s) return; if (editSymptoms.includes(s)) { input.value = ''; return; } editSymptoms.push(s); input.value = ''; renderEditSymptoms(); }
        function removeEditSymptom(i) { editSymptoms.splice(i, 1); renderEditSymptoms(); }
        function closeEditModal() { document.getElementById('editPatientModal').classList.add('hidden'); document.getElementById('editPatientModal').classList.remove('flex'); editSymptoms = []; }

        async function savePatientEdit() {
            const patientId = document.getElementById('editPatientId').value;
            if (!patientId) return;
            const feedback = document.getElementById('editFeedback');
            const payload = {
                name: document.getElementById('editName').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                age: parseInt(document.getElementById('editAge').value) || null,
                gender: document.getElementById('editGender').value,
                duration: document.getElementById('editDuration').value.trim(),
                status: document.getElementById('editStatus').value,
                triage_category: document.getElementById('editTriage').value,
                symptoms: editSymptoms,
                medications: document.getElementById('editMedications').value.trim(),
                breathing_trouble: document.getElementById('editBreathingTrouble').checked,
                family_history: document.getElementById('editFamilyHistory').checked,
                substance_use: document.getElementById('editSubstanceUse').checked,
                sexually_active: document.getElementById('editSexuallyActive').checked,
                notes: document.getElementById('editNotes').value.trim()
            };
            feedback.classList.add('hidden');
            try {
                const res = await fetch(`/api/patients/${patientId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) {
                    feedback.textContent = 'Updated successfully!';
                    feedback.className = 'text-center text-sm py-2 rounded-lg bg-green-100 text-green-700';
                    feedback.classList.remove('hidden');
                    setTimeout(() => { closeEditModal(); loadMyPatients(); }, 800);
                } else {
                    feedback.textContent = 'Error: ' + (data.error || 'Unknown');
                    feedback.className = 'text-center text-sm py-2 rounded-lg bg-red-100 text-red-700';
                    feedback.classList.remove('hidden');
                }
            } catch (e) {
                feedback.textContent = 'Network error';
                feedback.className = 'text-center text-sm py-2 rounded-lg bg-red-100 text-red-700';
                feedback.classList.remove('hidden');
            }
        }

        init();
        setInterval(loadMyPatients, 10000);
    </script>
</body>
</html>
