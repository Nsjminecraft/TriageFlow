<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageFlow - Waiting Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 text-blue-600 text-xl font-bold">
                <i class="fa-solid fa-heart-pulse text-2xl"></i>
                <span>TriageFlow</span>
            </div>
            <div class="flex items-center gap-2">
                <a href="/dashboard" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-gauge mr-2"></i>Dashboard</a>
                <a href="/my-patients" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-user-injured mr-2"></i>My Patients</a>
                <a href="/waiting-room" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium"><i class="fa-solid fa-users-viewfinder mr-2"></i>Waiting Room</a>
                <a href="/staff" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-users mr-2"></i>Staff</a>
                <a href="/condition-x" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-virus mr-2"></i>Condition X</a>
                {% if user_role == 'Admin' %}
                <a href="/settings" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-cog mr-2"></i>Settings</a>
                {% endif %}
                <a href="/bed-qr" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-qrcode mr-2"></i>Bed QR</a>
                <a href="/all-patients" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium"><i class="fa-solid fa-users-list mr-2"></i>All Patients</a>
                <a href="/logout" class="px-4 py-2 rounded-lg text-red-600 hover:bg-red-50 font-medium"><i class="fa-solid fa-sign-out mr-2"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="p-8 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-users-viewfinder mr-2"></i>Waiting Room</h1>
                <p class="text-gray-500">Patients who have checked in and are waiting</p>
            </div>
            <button onclick="loadArrivedPatients()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                <i class="fa-solid fa-refresh mr-2"></i>Refresh
            </button>
        </div>

        <div id="arrivedPatients" class="space-y-4">
            <div class="text-center py-8 text-gray-500">Loading patients...</div>
        </div>
    </div>

    <script>
        function loadArrivedPatients() {
            fetch('/api/arrived-patients')
                .then(res => res.json())
                .then(patients => {
                    const container = document.getElementById('arrivedPatients');
                    if (patients.length === 0) {
                        container.innerHTML = '<div class="text-center py-8 text-gray-500">No patients in waiting room</div>';
                        return;
                    }
                    
                    container.innerHTML = patients.map(p => {
                        const categoryColors = {
                            simple: 'bg-green-100 text-green-700',
                            attention: 'bg-yellow-100 text-yellow-700',
                            emergency: 'bg-orange-100 text-orange-700',
                            critical: 'bg-red-100 text-red-700'
                        };
                        const isCalled = p.called ? 'opacity-60' : '';
                        
                        return `
                            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 ${isCalled}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl font-bold">
                                            #${p.queue_number || '?'}
                                        </div>
                                        <div>
                                            <div class="font-semibold text-gray-900">${p.name}</div>
                                            <div class="text-sm text-gray-500">
                                                ${p.age || '?'} years old • ${p.gender || 'N/A'} • 
                                                <span class="px-2 py-0.5 rounded-full text-xs ${categoryColors[p.triage_category] || 'bg-gray-100'}">
                                                    ${p.triage_category || 'simple'}
                                                </span>
                                            </div>
                                            <div class="text-sm text-gray-500 mt-1">
                                                <i class="fa-solid fa-clock mr-1"></i>
                                                Arrived: ${p.arrival_time ? new Date(p.arrival_time).toLocaleTimeString() : 'Unknown'}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        ${p.called ? 
                                            `<button class="px-4 py-2 bg-gray-300 text-gray-600 rounded-lg cursor-not-allowed" disabled>
                                                <i class="fa-solid fa-check mr-2"></i>Called
                                            </button>` :
                                            `<button onclick="callPatient('${p._id}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
                                                <i class="fa-solid fa-bullhorn mr-2"></i>Call Name
                                            </button>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                })
                .catch(err => {
                    console.error('Error loading patients:', err);
                    document.getElementById('arrivedPatients').innerHTML = '<div class="text-center py-8 text-red-500">Error loading patients</div>';
                });
        }

        function callPatient(patientId) {
            fetch('/api/call-patient/' + patientId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ patient_id: patientId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Patient has been called!');
                    loadArrivedPatients();
                }
            })
            .catch(err => {
                console.error('Error calling patient:', err);
                alert('Error calling patient');
            });
        }

        // Load on page load
        loadArrivedPatients();
        
        // Auto-refresh every 30 seconds
        setInterval(loadArrivedPatients, 30000);
    </script>
</body>
</html>
