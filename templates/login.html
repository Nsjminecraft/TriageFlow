<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageFlow - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-heart-pulse text-4xl text-blue-600"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">TriageFlow</h1>
            <p class="text-blue-200">Hospital Dashboard Login</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="loginForm">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Login Type</label>
                    <select id="loginType" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" onchange="toggleLoginFields()">
                        <option value="staff">Staff (Doctor/Nurse)</option>
                        <option value="admin">Admin/Manager ID</option>
                    </select>
                </div>

                <div id="staffFields">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Staff ID</label>
                        <input type="text" id="staffId" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="e.g., STF001">
                    </div>
                </div>

                <div id="adminFields" class="hidden">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Admin ID</label>
                        <input type="text" id="adminId" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Enter admin ID">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Enter password">
                    </div>
                </div>

                <button type="submit" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-lg">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            
            <div id="errorMsg" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center"></div>
            
            <div class="mt-6 text-center">
                <a href="/patient-kiosk" class="text-blue-600 hover:text-blue-700 text-sm">
                    <i class="fa-solid fa-qrcode mr-1"></i> Patient Check-In (Scan QR)
                </a>
            </div>
        </div>

        <div class="text-center mt-6 text-blue-200 text-sm">
            <p>For demo: Use staff ID (e.g., DTS002) or admin ID: ADMIN001 / admin123</p>
        </div>
    </div>

    <script>
        function toggleLoginFields() {
            const loginType = document.getElementById('loginType').value;
            document.getElementById('staffFields').classList.toggle('hidden', loginType !== 'staff');
            document.getElementById('adminFields').classList.toggle('hidden', loginType !== 'admin');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginType = document.getElementById('loginType').value;
            const errorMsg = document.getElementById('errorMsg');
            
            let loginData = {};
            if (loginType === 'staff') {
                loginData = {
                    type: 'staff',
                    staff_id: document.getElementById('staffId').value
                };
            } else {
                loginData = {
                    type: 'admin',
                    admin_id: document.getElementById('adminId').value,
                    password: document.getElementById('password').value
                };
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = result.error || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = 'Login error. Please try again.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
